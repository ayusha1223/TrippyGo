name: TrippyGo Frontend CI

on:
  push:
    branches:
      - main

jobs:

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs:
      - frontend

    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t trippygo-frontend .