name: TrippyGo CI

on:
  push:
    branches:
      - main

jobs:

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./TrippyGo
        run: npm ci

      - name: Build frontend
        working-directory: ./TrippyGo
        run: npm run build


  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./TrippyGoBackend
        run: npm ci


  docker:
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    steps:
      - name: Get code from GitHub
        uses: actions/checkout@v4

      - name: Build Docker containers
        run: docker compose build